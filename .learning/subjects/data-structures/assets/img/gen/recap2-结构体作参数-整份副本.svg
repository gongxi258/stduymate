<svg viewBox="0 0 680 470" role="img" aria-hidden="true" fill="currentColor" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker></defs>
<text x="20" y="30" text-anchor="start" font-size="14">结构体作参数：函数拿到的是整份副本</text>
<text x="20" y="54" text-anchor="start" font-size="14">要改原件，把它的地址传下去</text>
<text x="60" y="104" text-anchor="start" font-size="14">&c = 0x7ffd20（main 那一份的起点）</text>
<rect x="60" y="120" width="300" height="40" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.5"/>
<text x="74" y="145" text-anchor="start" font-size="15">main 里的 c</text>
<text x="190" y="145" text-anchor="start" font-size="14">name 林小雨｜group 同学</text>
<text x="60" y="238" text-anchor="start" font-size="14">&c = 0x7ffd00（另一块）</text>
<rect x="60" y="250" width="300" height="40" rx="6" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="1.5"/>
<text x="74" y="275" text-anchor="start" font-size="15">函数里的 c</text>
<text x="190" y="275" text-anchor="start" font-size="14">name 林小雨｜group 同事</text>
<line x1="210" y1="162" x2="210" y2="242" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#tip)"/>
<text x="240" y="206" text-anchor="start" font-size="14">调用 set_group_copy(c, "同事")</text>
<text x="240" y="230" text-anchor="start" font-size="14">把 c 占的 32 个字节整份复制一份</text>
<text x="150" y="324" text-anchor="middle" font-size="14">函数里改 group，改的是副本这一块</text>
<text x="150" y="348" text-anchor="middle" font-size="14">main 里那一块没人碰</text>
<text x="430" y="104" text-anchor="start" font-size="14">还是同一块内存</text>
<rect x="430" y="120" width="190" height="40" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.5"/>
<text x="444" y="145" text-anchor="start" font-size="15">main 里的 c</text>
<text x="550" y="145" text-anchor="start" font-size="14">0x7ffd20</text>
<line x1="490" y1="190" x2="490" y2="164" stroke="currentColor" stroke-width="1.5" marker-end="url(#tip)"/>
<rect x="460" y="190" width="130" height="40" rx="6" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="1.5"/>
<text x="474" y="215" text-anchor="start" font-size="15">pc</text>
<text x="502" y="215" text-anchor="start" font-size="14">0x7ffd20</text>
<text x="430" y="252" text-anchor="start" font-size="14">函数拿到的是地址的副本：</text>
<text x="430" y="276" text-anchor="start" font-size="14">顺着它写回 main 那一块</text>
<text x="430" y="306" text-anchor="start" font-size="14">set_group(&c, "同事")</text>
<text x="430" y="330" text-anchor="start" font-size="14">改完 main 里 c.group 变成 同事</text>
<text x="430" y="372" text-anchor="start" font-size="14">两种写法都只传一样东西下去，</text>
<text x="430" y="396" text-anchor="start" font-size="14">差别在传的是整块内容还是它的起点地址</text>
<text x="340.0" y="446" text-anchor="middle" font-size="14">上一课的框架照样用：差别仍在副本里装的是什么，只是副本从 4 个字节变成了 32 个</text>
</svg>
