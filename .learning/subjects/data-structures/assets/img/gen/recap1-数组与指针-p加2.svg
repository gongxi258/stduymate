<svg viewBox="0 0 640 320" role="img" aria-hidden="true" fill="currentColor" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker></defs>
<text x="16" y="26" text-anchor="start" font-size="15">数组 a 的 4 个格子挨着放，指针 p 里装着 a[0] 的地址</text>
<rect x="320" y="58" width="130" height="56" rx="0" fill="currentColor" fill-opacity="0.14" stroke="currentColor" stroke-width="1.5"/>
<g fill="none">
<rect x="60" y="58" width="130" height="56" rx="0" stroke="currentColor" stroke-width="1.5"/>
<rect x="190" y="58" width="130" height="56" rx="0" stroke="currentColor" stroke-width="1.5"/>
<rect x="320" y="58" width="130" height="56" rx="0" stroke="currentColor" stroke-width="1.5"/>
<rect x="450" y="58" width="130" height="56" rx="0" stroke="currentColor" stroke-width="1.5"/>
</g>
<text x="125.0" y="92.0" text-anchor="middle" font-size="15">10</text>
<text x="125.0" y="46" text-anchor="middle" font-size="14">a[0]</text>
<text x="125" y="134" text-anchor="middle" font-size="13">0x7ffd10</text>
<text x="255.0" y="92.0" text-anchor="middle" font-size="15">20</text>
<text x="255.0" y="46" text-anchor="middle" font-size="14">a[1]</text>
<text x="255" y="134" text-anchor="middle" font-size="13">0x7ffd14</text>
<text x="385.0" y="92.0" text-anchor="middle" font-size="15">30</text>
<text x="385.0" y="46" text-anchor="middle" font-size="14">a[2]</text>
<text x="340" y="134" text-anchor="middle" font-size="13">0x7ffd18</text>
<text x="515.0" y="92.0" text-anchor="middle" font-size="15">40</text>
<text x="515.0" y="46" text-anchor="middle" font-size="14">a[3]</text>
<text x="500" y="134" text-anchor="middle" font-size="13">0x7ffd1c</text>
<text x="255.0" y="158" text-anchor="middle" font-size="13">每格占 4 字节，相邻两格差 4 号</text>
<rect x="60" y="210" width="300" height="44" rx="6" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="1.5"/>
<text x="74" y="238" text-anchor="start" font-size="15">p</text>
<text x="112" y="238" text-anchor="start" font-size="13">内容 0x7ffd10，就是 a 的地址</text>
<line x1="80" y1="210" x2="80" y2="116" stroke="currentColor" stroke-width="1.5" marker-end="url(#tip)"/>
<line x1="385.0" y1="148" x2="385.0" y2="196" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="385.0" y1="196" x2="385.0" y2="116" stroke="currentColor" stroke-width="1.5" marker-end="url(#tip)"/>
<text x="399.0" y="188" text-anchor="start" font-size="13">p + 2 落在这里</text>
<text x="320" y="292" text-anchor="middle" font-size="13">a[i] 与 *(p + i) 说的是同一个格子：p 加 1 不是一个字节，是一个 int 的宽度</text>
</svg>