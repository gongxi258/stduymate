<svg viewBox="0 0 640 290" role="img" aria-hidden="true" fill="currentColor" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker></defs>
<text x="16" y="32" text-anchor="start" font-size="15">连续存放的 5 个格子：第 i 个格子的地址 = 起始地址 + i × 每格字节数</text>
<rect x="260" y="60" width="100" height="60" fill="currentColor" fill-opacity="0.14" stroke="currentColor" stroke-width="1.5"/>
<g fill="none">
<rect x="60" y="60" width="100" height="60" rx="0" stroke="currentColor" stroke-width="1.5"/>
<rect x="160" y="60" width="100" height="60" rx="0" stroke="currentColor" stroke-width="1.5"/>
<rect x="260" y="60" width="100" height="60" rx="0" stroke="currentColor" stroke-width="1.5"/>
<rect x="360" y="60" width="100" height="60" rx="0" stroke="currentColor" stroke-width="1.5"/>
<rect x="460" y="60" width="100" height="60" rx="0" stroke="currentColor" stroke-width="1.5"/>
</g>
<text x="110.0" y="96.0" text-anchor="middle" font-size="15">第 0 格</text>
<text x="110.0" y="142" text-anchor="middle" font-size="14">[0]</text>
<text x="210.0" y="96.0" text-anchor="middle" font-size="15">第 1 格</text>
<text x="210.0" y="142" text-anchor="middle" font-size="14">[1]</text>
<text x="310.0" y="96.0" text-anchor="middle" font-size="15">第 2 格</text>
<text x="310.0" y="142" text-anchor="middle" font-size="14">[2]</text>
<text x="410.0" y="96.0" text-anchor="middle" font-size="15">第 3 格</text>
<text x="410.0" y="142" text-anchor="middle" font-size="14">[3]</text>
<text x="510.0" y="96.0" text-anchor="middle" font-size="15">第 4 格</text>
<text x="510.0" y="142" text-anchor="middle" font-size="14">[4]</text>
<line x1="60" y1="150" x2="60" y2="182" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="60" y="202" text-anchor="middle" font-size="13">起始地址 1000</text>
<line x1="260" y1="150" x2="260" y2="182" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="260" y="202" text-anchor="middle" font-size="13">下标 2 的地址 1000 + 2 × 4 = 1008</text>
<text x="260" y="228" text-anchor="middle" font-size="14">下标 2 一给出来，地址一步就算到，不用从头翻</text>
</svg>